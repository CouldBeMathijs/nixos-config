[bar.default]
center = []
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "session"
]
margin_edge = 4
margin_opposite_edge = 4
position = "left"
start = [ "launcher", "control-center", "wallpaper", "workspaces" ]

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 144.0
    cx = 768.0
    cy = 368.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        clock_style = "analog"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 288.0
    box_width = 432.0
    cx = 768.0
    cy = 768.0
    output = "eDP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 500.0

[location]
address = "Bruges, Belgium"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
font_family = "Andale Mono"

    [shell.launcher]
    category_icons_only = true
    default_view = "pinned"
    search_position = "top"
    show_navigation_labels = false

        [shell.launcher.providers.calculator]
        prefix = "calc"

        [shell.launcher.providers.emoji]
        prefix = "emo"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Eldritch"
community_palette = "Gruber Darker"
shell_mode = "dark"
source = "community"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "labwc",
        "mango",
        "niri",
        "qt",
        "scroll",
        "starship",
        "sway",
        "wezterm"
    ]
    community_ids = [ "libreoffice", "prismlauncher", "papirus-icons" ]

[wallpaper]
directory = "/home/mathijs/.dotfiles/images/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/mathijs/.dotfiles/images/wallpapers/tórshavn-um-náttina.jpg"

    [wallpaper.last]
    path = "/home/mathijs/.dotfiles/images/wallpapers/tórshavn-um-náttina.jpg"

[widget.brightness]
enabled = false

[widget.network]
enabled = true

[widget.wallpaper]
enabled = false
